name: Manual Package

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target script to run'
        required: true
        default: build-all
        type: choice
        options:
          - build-all
          - build-chunk

permissions:
  contents: read
  packages: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TERM: dumb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo bash ./install-dazzle.sh

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start BuildKit and local registry
        run: |
          chmod +x ./start-dazzle.sh
          sudo bash ./start-dazzle.sh &
          sleep 5 # Wait for BuildKit and registry to start

      - name: Prebuild setup
        run: |
          chmod +x ./prebuild-dazzle.sh
          sudo bash ./prebuild-dazzle.sh

      - name: Run build script
        run: |
          chmod +x ./${{ inputs.target }}.sh
          sudo bash ./${{ inputs.target }}.sh

      - name: Create image combinations
        run: |
          sudo bash -c 'source ./setup-repo.sh && dazzle combine ${REPO} --all -v'

      - name: Sync images to GHCR
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: |
          chmod +x ./skopeo-sync.sh
          export REGISTRY_AUTH_FILE="$HOME/.docker/config.json"
          bash ./skopeo-sync.sh

      - name: Cleanup
        if: always()
        run: |
          docker rm -f registry || true
          if [ -f /tmp/buildkitd.pid ]; then kill "$(cat /tmp/buildkitd.pid)" || true; fi
